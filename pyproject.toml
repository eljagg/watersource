[tool.ruff]
line-length = 180
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101", "S308", "S603", "S607", "B008", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"apps/*/management/*" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]
