{% extends "base.html" %}{% block content %}<div class="card mx-auto max-w-2xl p-6 sm:p-8"><h1 class="page-title mb-1">Upload CSV — {{ category.name }}</h1><p class="text-body mb-4 text-sm">Use the <a class="link" href="{% url 'submissions:template' category.code %}">template for version {{ version.version }}</a>. Every row is validated; rows with errors are listed back to you and are not accepted.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="file" name="file" accept=".csv" required class="mb-3"><label class="mb-4 block space-y-1 text-sm">Note for the reviewer (optional)<textarea name="note" rows="2"></textarea></label><button class="btn-primary">Upload and validate</button></form></div>{% endblock %}
