{% extends "base.html" %}{% block content %}<div class="mx-auto max-w-2xl rounded bg-white p-6 shadow"><h1 class="text-xl font-semibold mb-1">Upload CSV — {{ category.name }}</h1><p class="text-sm text-slate-600 mb-4">Use the <a class="underline" href="{% url 'submissions:template' category.code %}">template for version {{ version.version }}</a>. Every row is validated; rows with errors are listed back to you and are not accepted.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="file" name="file" accept=".csv" required class="mb-3"><label class="block mb-3 text-sm">Note for the reviewer (optional)<textarea name="note" rows="2" class="w-full rounded border p-2"></textarea></label><button class="rounded bg-sky-800 px-4 py-2 text-white">Upload and validate</button></form></div>{% endblock %}
