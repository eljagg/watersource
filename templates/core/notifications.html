{% extends "base.html" %}{% block content %}<h1 class="page-title mb-6">Notifications</h1>
<ul class="card divide-y divide-slate-200 dark:divide-slate-800">{% for n in notifications %}<li class="p-4 {% if not n.read_at %}bg-amber-50 dark:bg-amber-950/30{% endif %}">
<form method="post" action="{% url 'core:notification_read' n.pk %}">{% csrf_token %}<button class="text-left w-full"><div class="font-medium">{{ n.title }}</div><div class="text-body text-sm">{{ n.body|linebreaksbr }}</div><div class="text-muted text-xs">{{ n.created_at }}</div></button></form></li>
{% empty %}<li class="text-muted p-3">No notifications.</li>{% endfor %}</ul>{% endblock %}
