{% for field in form %}<div class="mb-3"><label class="block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="text-xs text-slate-500">{{ field.help_text|safe }}</div>{% endif %}{% for e in field.errors %}<div class="text-sm text-red-700">{{ e }}</div>{% endfor %}</div>{% endfor %}
{% for e in form.non_field_errors %}<div class="text-sm text-red-700 mb-2">{{ e }}</div>{% endfor %}
