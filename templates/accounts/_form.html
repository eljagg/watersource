{% for field in form %}<div class="mb-4 space-y-1"><label class="block" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="text-muted text-xs">{{ field.help_text|safe }}</div>{% endif %}{% for e in field.errors %}<div class="text-danger text-sm">{{ e }}</div>{% endfor %}</div>{% endfor %}
{% for e in form.non_field_errors %}<div class="text-danger mb-2 text-sm">{{ e }}</div>{% endfor %}
